services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinela-postgres
    environment:
      POSTGRES_DB: sentinela
      POSTGRES_USER: sentinela
      POSTGRES_PASSWORD: sentinela
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinela -d sentinela"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sentinela-redis
    ports:
      - "6379:6379"
    profiles: ["async"]

volumes:
  postgres_data:
