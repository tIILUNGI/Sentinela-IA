[project]
name = "sentinela-api"
version = "0.1.0"
description = "SENTINELA AI - Operational Intelligence Platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.1,<5.0.0",
  "python-multipart>=0.0.12",
  "email-validator>=2.2.0",
  "httpx>=0.27.0",
  "pgvector>=0.3.6",
  "pymupdf>=1.25.0",
  "python-docx>=1.1.2",
  "pytesseract>=0.3.13",
  "pillow>=11.0.0",
  "numpy>=2.1.0",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
